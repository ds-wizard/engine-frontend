server {
    listen       8080;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # One application at the root: every address that is not a file is one of
    # its pages, and the page is index.html.
    location / {
        add_header  Last-Modified "";
        try_files $uri $uri/ /index.html;
    }

    # Read on every load, so a new build and a changed configuration are
    # picked up at once; the bundles they name are hashed and can be cached.
    location = /index.html {
        add_header  Cache-Control "no-cache";
    }

    location = /config.js {
        add_header  Cache-Control "no-cache";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
