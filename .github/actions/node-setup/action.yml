name: Node setup
description: Node.js, the npm and Elm caches, the dependencies and the patched Elm kernel packages

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: package-lock.json

    # The Elm packages: downloaded once per elm.json, whichever job asks first
    - name: Cache Elm packages
      uses: actions/cache@v5
      with:
        path: elm-stuff/elm-home
        key: elm-home-${{ hashFiles('elm.json', 'packages/elm-kernel-replacements/**/source.txt') }}

    - name: Elm kernel replacements
      shell: bash
      run: npm run replace-kernel-packages

    - name: Install
      shell: bash
      run: npm ci --no-audit --no-fund
