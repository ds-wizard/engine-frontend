name: Node setup
description: Node.js, the npm cache, the Elm packages, the dependencies and the patched Elm kernel packages

inputs:
  elm-packages:
    description: The cache key of the Elm packages, from the elm-packages job's output; empty for a job that compiles no Elm
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: package-lock.json

    # The Elm packages, complete, as the elm-packages job saved them: only ever restored
    # here, so a job that needs fewer of them cannot save a cache that lacks the rest
    - name: Restore Elm packages
      if: inputs.elm-packages != ''
      uses: actions/cache/restore@v6
      with:
        path: elm-stuff/elm-home
        key: ${{ inputs.elm-packages }}
        fail-on-cache-miss: true

    - name: Elm kernel replacements
      shell: bash
      run: npm run replace-kernel-packages

    - name: Install
      shell: bash
      run: npm ci --no-audit --no-fund
